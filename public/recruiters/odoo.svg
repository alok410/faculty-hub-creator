<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 40" width="140" height="40" fill="none">
  <!-- Official Odoo Logo Styling -->
  <g fill="#714B67">
    <!-- 'o' -->
    <circle cx="16" cy="22" r="12" fill="none" stroke="#714B67" stroke-width="5.5"/>
    <!-- 'd': bowl on left, stem on right -->
    <circle cx="48" cy="22" r="12" fill="none" stroke="#714B67" stroke-width="5.5"/>
    <rect x="54.5" y="4" width="5.5" height="30" rx="2.75" fill="#714B67"/>
  </g>
  <g fill="#017E84">
    <!-- 'o' in teal/cyan -->
    <circle cx="85" cy="22" r="12" fill="none" stroke="#017E84" stroke-width="5.5"/>
  </g>
  <g fill="#714B67">
    <!-- 'o' -->
    <circle cx="119" cy="22" r="12" fill="none" stroke="#714B67" stroke-width="5.5"/>
  </g>
</svg>
